# Warm EQ for the Sony ULT Field 1, measured with tools/eq (see README). Runs as its own client of the
# isolated PipeWire session (audiohub-eq.service); the +3.9 dB bass lift is balanced by a -4.7 dB preamp.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
      args = {
      node.description = "Audiohub EQ"
      media.name = "Audiohub EQ"
      filter.graph = {
        nodes = [ { type = builtin name = preL label = linear control = { Mult = 0.5821 Add = 0.0 } } { type = builtin name = l1 label = bq_peaking control = { Freq = 120.0 Q = 1.0 Gain = 3.9 } } { type = builtin name = l2 label = bq_peaking control = { Freq = 250.0 Q = 0.9 Gain = 0.9 } } { type = builtin name = l3 label = bq_peaking control = { Freq = 4000.0 Q = 0.8 Gain = -1.3 } } { type = builtin name = l4 label = bq_peaking control = { Freq = 7000.0 Q = 1.0 Gain = -2.7 } } { type = builtin name = preR label = linear control = { Mult = 0.5821 Add = 0.0 } } { type = builtin name = r1 label = bq_peaking control = { Freq = 120.0 Q = 1.0 Gain = 3.9 } } { type = builtin name = r2 label = bq_peaking control = { Freq = 250.0 Q = 0.9 Gain = 0.9 } } { type = builtin name = r3 label = bq_peaking control = { Freq = 4000.0 Q = 0.8 Gain = -1.3 } } { type = builtin name = r4 label = bq_peaking control = { Freq = 7000.0 Q = 1.0 Gain = -2.7 } } ]
        links = [ { output = "preL:Out" input = "l1:In" } { output = "l1:Out" input = "l2:In" } { output = "l2:Out" input = "l3:In" } { output = "l3:Out" input = "l4:In" } { output = "preR:Out" input = "r1:In" } { output = "r1:Out" input = "r2:In" } { output = "r2:Out" input = "r3:In" } { output = "r3:Out" input = "r4:In" } ]
        inputs = [ "preL:In" "preR:In" ]
        outputs = [ "l4:Out" "r4:Out" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = { node.name = "audiohub_eq" node.description = "Audiohub EQ" media.class = Audio/Sink }
      playback.props = { node.name = "audiohub_eq_out" target.object = "bluez_output.74_68_59_68_28_17.1" node.dont-fallback = true node.passive = true }
    }
    }
]
