general = {
  name = "Homelab Sony";
  // Sony reports ~140 ms A2DP delay (+ ~30 ms loopback/quantum) that shairport cannot
  // see through the null sink; advance the output by that much so AirPlay video stays in sync.
  audio_backend_latency_offset_in_seconds = -0.17;
  output_backend = "pa";
  mdns_backend = "avahi";
};
pa = {
  application_name = "AudioHub AirPlay";
  sink = "audiohub_airplay";
};
sessioncontrol = {
  session_timeout = 30;
};
