general = {
  name = "Homelab Sony";
  // Sony reports ~140 ms A2DP delay (+ ~30 ms loopback/quantum) that shairport cannot
  // see through the null sink; advance the output by that much so AirPlay video stays in sync.
  audio_backend_latency_offset_in_seconds = -0.17;
  audio_backend_buffer_desired_length_in_seconds = 0.35;
  // Default curve attenuates ~-43 dB at AirPlay -20 dB, which is near silent into a software sink.
  volume_control_profile = "flat";
  volume_range_db = 30;
  // Output-delay estimates through pipewire-pulse jump by ~0.06-0.09 s after every flush; at the
  // default 0.05 s that kicks off an endless flush/resync loop.
  resync_threshold_in_seconds = 0.25;
  output_backend = "pulseaudio";
  mdns_backend = "avahi";
};
pulseaudio = {
  application_name = "AudioHub AirPlay";
  sink = "audiohub_airplay";
};
sessioncontrol = {
  session_timeout = 60;
};
